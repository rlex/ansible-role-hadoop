---
- name: Create hdfs namenode data directory
  ansible.builtin.file:
    mode: '0755'
    path: "{{ hadoop_hdfs_namenode_name_dir }}"
    state: directory
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
  register: hadoop_create_hdfs_namenode_data_dir

- name: Format hdfs namenode data directory
  ansible.builtin.command: "{{ hadoop_home }}/bin/hdfs namenode -format"
  register: hadoop_format_namenode
  changed_when: hadoop_format_namenode.rc == 0
  failed_when: hadoop_format_namenode.rc != 0
  when: hadoop_create_hdfs_namenode_data_dir is changed
  become: true
  become_user: "{{ hadoop_user }}"

- name: Create hdfs namenode systemd service file
  ansible.builtin.template:
    mode: '0644'
    src: systemd/hdfs-namenode.service.j2
    dest: /etc/systemd/system/hdfs-namenode.service
  notify:
    - Reload systemd
    - Restart hdfs-namenode

- name: Start hdfs namenode
  ansible.builtin.service:
    name: hdfs-namenode
    state: started
    enabled: true
